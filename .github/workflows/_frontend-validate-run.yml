name: Frontend validate run

# Reusable job body for frontend-ci.yml. Exists so the same suite can run on either runner
# pool (GitHub-hosted first, self-hosted fallback) without duplicating the steps — see
# frontend-ci.yml for the fallback policy and reasoning.

on:
  workflow_call:
    inputs:
      runs-on-json:
        description: JSON array of runner labels, e.g. '["ubuntu-latest"]'
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  validate:
    runs-on: ${{ fromJson(inputs.runs-on-json) }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --loglevel=error

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test:coverage
        timeout-minutes: 15

      # The report's paths are relative to frontend/, and mobile's to mobile/ — both trees
      # have an app/ and a lib/, so unprefixed they would be indistinguishable to Codecov.
      - name: Prefix coverage paths with the workspace
        run: sed -i 's|^SF:|SF:frontend/|' coverage/lcov.info

      - name: Send coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend

      # Both NEXT_PUBLIC_* origins are required: lib/api/config.ts throws on an empty one in
      # a production build, which is the point — a missing repo Variable would otherwise ship
      # a bundle whose every request is a relative URL back at the Next.js server. The values
      # here are placeholders; the real ones come from repo Variables at image-build time.
      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_SSE_URL: http://localhost:5001

      # `pnpm build` succeeding says nothing about whether the standalone output it
      # produced can start: v0.4.0 shipped an image that died on its first module load
      # (@swc/helpers traced through its `require` condition, resolved at runtime through
      # `import`) and restart-looped, with a green build behind it. Booting the artifact
      # is the only gate that sees that class of breakage.
      - name: Smoke-test the standalone server
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          PORT=3123 node .next/standalone/server.js &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3123/login; then
              echo "standalone server served /login"
              exit 0
            fi
            sleep 1
          done
          echo "standalone server never served a request"
          exit 1

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high
