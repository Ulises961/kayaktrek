name: Frontend CI

# Gate only — this workflow builds no image. Publishing moved to release.yml so that
# what is deployable is always a deliberate version tag, not whatever merged last.

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --loglevel=error

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test:run
        timeout-minutes: 10

      # Both NEXT_PUBLIC_* origins are required: lib/api/config.ts throws on an empty one in
      # a production build, which is the point — a missing repo Variable would otherwise ship
      # a bundle whose every request is a relative URL back at the Next.js server. The values
      # here are placeholders; the real ones come from repo Variables at image-build time.
      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_SSE_URL: http://localhost:5001

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high
