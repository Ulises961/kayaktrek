name: Frontend CI

# Gate only — this workflow builds no image. Publishing moved to release.yml so that
# what is deployable is always a deliberate version tag, not whatever merged last.

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/_frontend-validate-run.yml"
  pull_request:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/_frontend-validate-run.yml"

# See backend-ci.yml for the reasoning. Separate group name so the two workflows cancel
# independently — a frontend-only push should not cancel a backend run on the same ref.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # GitHub-hosted first: see backend-ci.yml for the fallback policy — same reasoning here.
  validate-hosted:
    uses: ./.github/workflows/_frontend-validate-run.yml
    with:
      runs-on-json: '["ubuntu-latest"]'

  validate-fallback:
    needs: validate-hosted
    if: always() && needs.validate-hosted.result == 'failure'
    uses: ./.github/workflows/_frontend-validate-run.yml
    with:
      runs-on-json: '["self-hosted","linux","x64"]'
