name: Frontend CI

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --loglevel=error

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test:run

      # Both NEXT_PUBLIC_* origins are required: lib/api/config.ts throws on an empty one in
      # a production build, which is the point — a missing repo Variable would otherwise ship
      # a bundle whose every request is a relative URL back at the Next.js server. The values
      # here are placeholders; the real ones come from repo Variables at image-build time.
      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_SSE_URL: http://localhost:5001

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

  docker-build-push:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # The runner's default builder uses the `docker` driver, which doesn't support
      # `cache-to: type=gha` (cache export) at all — only the `docker-container` driver
      # this action sets up does.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GitHub Actions expressions have no case-conversion function (`toLower(...)` is not
      # a real one — it silently invalidated this entire workflow file, blocking every job
      # in it, push and pull_request alike, since the pipeline's first commit); lowercase
      # the owner in a shell step instead.
      - name: Compute lowercase image repository owner
        id: vars
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # NEXT_PUBLIC_* vars are inlined into the client bundle at build time — sourced from
      # repo Variables (Settings > Actions > Variables), not hardcoded, so the real values
      # get set once a domain exists (ADR-034) without touching this workflow. Empty repo
      # vars just bake in an empty string until then.
      # ADR-034: images are private by default — see DEPLOY.md for the deploy-side login.
      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SSE_URL=${{ vars.NEXT_PUBLIC_SSE_URL }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/kayak-expedition-planner-frontend:latest
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/kayak-expedition-planner-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
