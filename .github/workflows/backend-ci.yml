name: Backend CI

# Gate only — this workflow builds no image. Publishing moved to release.yml so that
# what is deployable is always a deliberate version tag, not whatever merged last.

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/_backend-test-run.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/_backend-test-run.yml"

# Cancel a run the moment a newer commit supersedes it. Without this, pushing three times to
# a PR runs three full suites to completion and only the last one's result is ever read — at
# ~7 minutes each that is most of the spend on a branch being iterated on.
#
# Grouped per ref, so runs on different PRs never cancel each other. `master` is deliberately
# excluded from cancellation (see the `!= 'refs/heads/master'` guard): a push to master is the
# gate for a commit that is already merged, and cancelling it would leave that commit with no
# result at all.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # GitHub-hosted first: it's idle capacity we're not otherwise using, and it starts
  # immediately instead of queuing behind whatever the home box is already running.
  test-hosted:
    uses: ./.github/workflows/_backend-test-run.yml
    with:
      runs-on-json: '["ubuntu-latest"]'
    secrets: inherit

  # Falls back to the self-hosted runner only once the hosted run has actually failed —
  # which is also what happens once the account's free GitHub-hosted minutes run out for
  # the billing cycle (the job fails fast rather than queuing). A genuine test failure on
  # the hosted runner pays for one extra self-hosted run before showing red; that's the
  # accepted cost of not being able to distinguish "out of minutes" from "tests failed"
  # from inside the workflow.
  test-fallback:
    needs: test-hosted
    if: always() && needs.test-hosted.result == 'failure'
    uses: ./.github/workflows/_backend-test-run.yml
    with:
      runs-on-json: '["self-hosted","linux","x64"]'
    secrets: inherit

  # A workflow run's own conclusion is the worst of every job in it, so a spent-minutes
  # failure on test-hosted paints the whole run red even after test-fallback recovers it.
  # This job is the one status worth looking at: green if either runner actually passed.
  # Self-hosted, not hosted: once GitHub-hosted minutes are exhausted for the cycle, a
  # hosted runner can't be relied on to even pick up this trivial check.
  test-result:
    needs: [test-hosted, test-fallback]
    if: always()
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Require at least one runner to have passed
        run: |
          if [ "${{ needs.test-hosted.result }}" = "success" ] || [ "${{ needs.test-fallback.result }}" = "success" ]; then
            exit 0
          fi
          echo "Neither the hosted nor the self-hosted run passed."
          exit 1
