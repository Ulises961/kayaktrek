name: Backend CI

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: kayak
          POSTGRES_PASSWORD: kayak_test_password
          POSTGRES_DB: kayak_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U kayak"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      CONFIG_MODE: testing
      DATABASE_URL: postgresql://kayak:kayak_test_password@localhost:5434/kayak_test
      SECRET_KEY: ci-secret-key-not-used-in-prod
      JWT_SECRET_KEY: ci-jwt-secret-key-minimum-32-bytes!
      RATELIMIT_STORAGE_URI: memory://

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Dependency audit
        run: |
          uv export --no-dev --frozen --no-emit-project > requirements-audit.txt
          uvx pip-audit --local -r requirements-audit.txt

      - name: Lint (flake8)
        run: uv run flake8 .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check for model/migration drift
        run: uv run alembic check

      - name: Run tests
        run: uv run pytest --tb=short -q --cov=. --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend

  docker-build-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # The runner's default builder uses the `docker` driver, which doesn't support
      # `cache-to: type=gha` (cache export) at all — only the `docker-container` driver
      # this action sets up does.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GitHub Actions expressions have no case-conversion function (`toLower(...)` is not
      # a real one — it silently invalidated this entire workflow file, blocking every job
      # in it, push and pull_request alike, since the pipeline's first commit); lowercase
      # the owner in a shell step instead.
      - name: Compute lowercase image repository owner
        id: vars
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # ADR-034: images are private by default (not-yet-public app) — the deploy target
      # authenticates with `docker login ghcr.io` using a PAT, see DEPLOY.md.
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/kayak-expedition-planner-backend:latest
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/kayak-expedition-planner-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
