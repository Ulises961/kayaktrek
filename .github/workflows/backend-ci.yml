name: Backend CI

# Gate only — this workflow builds no image. Publishing moved to release.yml so that
# what is deployable is always a deliberate version tag, not whatever merged last.

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

# Cancel a run the moment a newer commit supersedes it. Without this, pushing three times to
# a PR runs three full suites to completion and only the last one's result is ever read — at
# ~7 minutes each that is most of the spend on a branch being iterated on.
#
# Grouped per ref, so runs on different PRs never cancel each other. `master` is deliberately
# excluded from cancellation (see the `!= 'refs/heads/master'` guard): a push to master is the
# gate for a commit that is already merged, and cancelling it would leave that commit with no
# result at all.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    # Self-hosted: minutes on an own-machine runner are unmetered, and this suite is ~6.7
    # minutes a run — the single largest consumer of the GitHub-hosted allowance. Nothing
    # else about the pipeline changes: same steps, same service containers, same gate.
    #
    # Matched by label rather than by runner name, so a second machine can be added for
    # availability without editing this file.
    #
    # The trade is that a job queues, rather than fails, when no runner is online — a PR
    # check sits pending indefinitely instead of going red. That is why the runner should be
    # installed as a systemd service (`sudo ./svc.sh install && sudo ./svc.sh start`) rather
    # than started by hand.
    runs-on: [self-hosted, linux, x64]

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: kayak
          POSTGRES_PASSWORD: kayak_test_password
          POSTGRES_DB: kayak_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U kayak"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      CONFIG_MODE: testing
      DATABASE_URL: postgresql://kayak:kayak_test_password@localhost:5434/kayak_test
      SECRET_KEY: ci-secret-key-not-used-in-prod
      JWT_SECRET_KEY: ci-jwt-secret-key-minimum-32-bytes!
      RATELIMIT_STORAGE_URI: memory://

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Dependency audit
        run: |
          uv export --no-dev --frozen --no-emit-project > requirements-audit.txt
          uvx pip-audit --local -r requirements-audit.txt

      - name: Lint (flake8)
        run: uv run flake8 .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check for model/migration drift
        run: uv run alembic check

      - name: Run tests
        run: uv run pytest --tb=short -q --cov=. --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
