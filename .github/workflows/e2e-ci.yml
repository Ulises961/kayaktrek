name: E2E Tests

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - "backend/**"
      - "e2e/**"
      - ".github/workflows/e2e-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "frontend/**"
      - "backend/**"
      - "e2e/**"
      - ".github/workflows/e2e-ci.yml"

# CI ports are offset from the dev stack (5000/3000) so act runs don't clash
# with a live local environment.
env:
  CI_BACKEND_PORT: 5100
  CI_FRONTEND_PORT: 3100

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: kayak
          POSTGRES_PASSWORD: kayak_test_password
          POSTGRES_DB: kayak_e2e
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U kayak"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # --- Backend ---
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
          prune-cache: false

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://kayak:kayak_test_password@localhost:5435/kayak_e2e
        run: uv run alembic upgrade head

      - name: Start backend
        working-directory: backend
        env:
          FLASK_APP: wsgi:app
          CONFIG_MODE: testing
          DATABASE_URL: postgresql://kayak:kayak_test_password@localhost:5435/kayak_e2e
          SECRET_KEY: ci-secret-key-not-used-in-prod
          JWT_SECRET_KEY: ci-jwt-secret-key-minimum-32-bytes!
          FRONTEND_URL: http://localhost:${{ env.CI_FRONTEND_PORT }}
        run: |
          fuser -k "${CI_BACKEND_PORT}/tcp" 2>/dev/null || true
          setsid nohup uv run flask run --host=0.0.0.0 --port=${{ env.CI_BACKEND_PORT }} > /tmp/flask.log 2>&1 &
          FLASK_PID=$!
          sleep 3
          kill -0 $FLASK_PID 2>/dev/null || { cat /tmp/flask.log; exit 1; }

      # --- Frontend ---
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --loglevel=error

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:${{ env.CI_BACKEND_PORT }}
        run: pnpm build

      - name: Start frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:${{ env.CI_BACKEND_PORT }}
          PORT: ${{ env.CI_FRONTEND_PORT }}
        run: |
          fuser -k "${CI_FRONTEND_PORT}/tcp" 2>/dev/null || true
          setsid nohup pnpm start > /tmp/frontend.log 2>&1 &
          FRONTEND_PID=$!
          sleep 5
          kill -0 $FRONTEND_PID 2>/dev/null || { cat /tmp/frontend.log; exit 1; }

      # --- E2E ---
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for services
        run: npx --yes wait-on tcp:localhost:${{ env.CI_BACKEND_PORT }} http://localhost:${{ env.CI_FRONTEND_PORT }} --timeout 60000

      - name: Run E2E tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:${{ env.CI_FRONTEND_PORT }}
          E2E_API_URL: http://localhost:${{ env.CI_BACKEND_PORT }}
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
