name: Release

# The ONLY workflow that publishes images.
#
# Backend CI and Frontend CI gate every PR and every merge, but they no longer build or
# push anything: what is deployable is now always something someone deliberately tagged,
# never "whatever happened to merge last". That also means a release builds BOTH images
# regardless of which paths changed — the per-workflow path filters exist to keep CI fast
# on a one-line change, which is the opposite of what a release wants.
#
# Triggered by pushing a version tag, or by hand (Actions > Release > Run workflow, or
# `gh workflow run release.yml --ref <tag-or-main>`) when the images need rebuilding
# without a code change.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # GitHub-hosted first: it's idle capacity we're not otherwise using, and it starts
  # immediately instead of queuing behind whatever the home box is already running.
  #
  # This is the same hosted-first/self-hosted-fallback pattern backend-ci.yml and
  # frontend-ci.yml already use (PR #164/#166) — extended here after v0.7.0's tag push
  # discovered that "release.yml stays on GitHub-hosted so it still works with the runner
  # off" doesn't hold once the account has no payment method and a $0 Actions spending
  # limit: the hosted job fails to even start ("recent account payments have failed or
  # your spending limit needs to be increased"), every time, forever, not just when
  # minutes for the cycle run out.
  publish-hosted:
    uses: ./.github/workflows/_release-publish-run.yml
    with:
      runs-on-json: '["ubuntu-latest"]'
    secrets: inherit

  # Falls back to the self-hosted runner once the hosted run has actually failed — which,
  # per the above, is unconditionally what happens right now. That means every release
  # currently pays for one guaranteed-failing hosted attempt before the real build runs;
  # accepted rather than dropping the hosted attempt entirely, because a payment method
  # or a raised spending limit added later makes it free capacity again with no workflow
  # change needed.
  publish-fallback:
    needs: publish-hosted
    if: always() && needs.publish-hosted.result == 'failure'
    uses: ./.github/workflows/_release-publish-run.yml
    with:
      runs-on-json: '["self-hosted","linux","x64"]'
    secrets: inherit

  # A workflow run's own conclusion is the worst of every job in it, so a spent-minutes
  # (or, currently, billing-blocked) failure on publish-hosted paints the whole run red
  # even after publish-fallback recovers it. This job is the one status worth looking at:
  # green if either runner actually published. Self-hosted, not hosted: once GitHub-hosted
  # is unusable for the reason above, a hosted runner can't be relied on to even pick up
  # this trivial check.
  publish-result:
    needs: [publish-hosted, publish-fallback]
    if: always()
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Require at least one runner to have published
        run: |
          if [ "${{ needs.publish-hosted.result }}" = "success" ] || [ "${{ needs.publish-fallback.result }}" = "success" ]; then
            exit 0
          fi
          echo "Neither the hosted nor the self-hosted run published."
          exit 1
