name: No AI Co-Author Attribution

# Gate: rejects a PR whose commits carry an AI co-author trailer (e.g.
# `Co-Authored-By: Claude ...`, `Claude-Session:`) or whose description
# credits an AI coding tool. Complements, not replaces, the local
# `commit-msg` lefthook hook — that one only runs on a contributor's own
# machine and is bypassable with `--no-verify`; this one runs on GitHub and,
# once added to branch protection as a required check, can't be skipped.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

jobs:
  # Hosted first, self-hosted on failure, same as backend-ci.yml and frontend-ci.yml.
  # This check is a git log and two greps, so it needs nothing a runner pool provides —
  # which is exactly why it had no fallback and why that was worth fixing anyway: when
  # the hosted pool is unavailable (a billing lapse takes every hosted job down at once,
  # in ~3s with zero steps), a check with no fallback reports `fail` on a PR that has
  # nothing wrong with it. A red check that means "the runner is gone" teaches people to
  # merge past a red check, which costs more than the minute this fallback spends.
  check-hosted:
    uses: ./.github/workflows/_no-ai-attribution-run.yml
    with:
      runs-on-json: '["ubuntu-latest"]'

  check-fallback:
    needs: check-hosted
    if: always() && needs.check-hosted.result == 'failure'
    uses: ./.github/workflows/_no-ai-attribution-run.yml
    with:
      runs-on-json: '["self-hosted","linux","x64"]'

  # The job to require in branch protection: the two above are allowed to fail
  # individually, and only their disagreement is a real verdict. Self-hosted so it can
  # still report when the hosted pool is the thing that is down.
  check-result:
    needs: [check-hosted, check-fallback]
    if: always()
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Require at least one runner to have passed
        run: |
          if [ "${{ needs.check-hosted.result }}" = "success" ] || [ "${{ needs.check-fallback.result }}" = "success" ]; then
            exit 0
          fi
          echo "Neither the hosted nor the self-hosted run passed."
          exit 1
