[project]
name = "kayak-expedition-planner"
version = "0.8.0"
requires-python = ">=3.12"
dependencies = [
    "flask",
    "celery",
    "kombu",
    "marshmallow",
    "marshmallow-sqlalchemy",
    "flask-sqlalchemy>=3.1.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary",
    "flask-bcrypt",
    "python-dotenv",
    "pyjwt",
    "flask-migrate",
    "alembic",
    "geoalchemy2",
    "openmeteo-requests",
    "requests-cache",
    "retry-requests",
    "setuptools",
    "bleach",
    "uuid_extension",
    "camel-converter",
    "flask-limiter",
    "redis>=3.0",
    "flask-mail",
    "gunicorn",
    "boto3",
    "python-magic",
    "cryptography>=48.0.1",
    "gpxpy",
    "defusedxml",
    "shapely",
    "flask-caching",
    "global-land-mask>=1.0.0",
    "gevent",
    "psycogreen",
    "timezonefinder>=8.2.5",
    "logfire[celery,flask,requests,sqlalchemy]>=4.38.0",
    "apispec>=6.10.0",
    "apispec-webframeworks>=1.2.0",
    "flask-swagger-ui>=5.32.9",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-dotenv",
    "pytest-xdist",
    "path",
    "openapi-spec-validator>=0.9.0",
]

[tool.mypy]
python_version = "3.12"
files = ["Api", "Models", "Resources", "Schemas", "Services", "Tasks"]
# Gradual adoption: third-party deps without stubs (geoalchemy2, openmeteo_requests,
# flask_bcrypt, camel_converter, …) must not flood the report while we annotate.
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
# Per-layer strictness is tightened in the overrides below as each layer's
# annotation pass lands (Models → Schemas → Services → Resources).

[[tool.mypy.overrides]]
module = "Models.*"
disallow_incomplete_defs = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["Api*", "Models*", "Resources*", "Schemas*", "Services*", "Tasks*", "Tests*"]
