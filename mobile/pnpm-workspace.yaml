allowBuilds:
  unrs-resolver: true
# Security floors for transitive dependencies (pnpm audit --prod). Each stays inside the
# major its parent already uses; glob, minimatch and uuid are left out on purpose, since
# their fixes are major jumps inside @expo/cli and the Xcode config plugin (build tooling).
# decode-uri-component is left out too: every patched release (>=0.5.1) is ESM-only, and
# expo-router's query-string 7 require()s it, so the override broke jest and would break the
# bundle. It waits on expo-router moving off query-string 7.
overrides:
  shell-quote: ^1.11.0
  compression: ^1.8.2
  node-forge: ^1.4.3
  source-map-js: ^1.2.2
  "brace-expansion@1": ^1.1.21
  "brace-expansion@5": ^5.0.12
  "@expo/cli>zod": ^4.6.6
patchedDependencies:
  expo-task-manager@57.0.21: patches/expo-task-manager@57.0.21.patch
