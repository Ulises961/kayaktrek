services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: kayak_rabbitmq
    ports:
      # M11 §4: was the only infra service bound to 0.0.0.0 — the management UI was a
      # listening console on any network the host is attached to.
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"  # Management UI → http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: kayak_postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kayak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-kayak_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kayak} -d ${POSTGRES_DB:-kayak_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kayak_redis
    # Was running on unconfigured image defaults: maxmemory 0 (unbounded growth) +
    # maxmemory-policy noeviction (once a cap IS hit, Redis rejects writes outright,
    # across rate limiter/cache/Celery results at once) + periodic RDB snapshotting
    # (disk I/O the foundation ADR's pub/sub design explicitly wants to avoid). All three
    # workloads sharing this instance are disposable — limiter counters reset harmlessly,
    # cache entries just get refetched, Celery results are for short-lived checkable jobs —
    # so graceful LRU eviction with persistence off is a strict improvement over the
    # defaults, not a tradeoff. Site evaluation follow-up, 2026-07-04.
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local SMTP sink. Everything the dev/e2e stack sends lands here and goes no further
  # — nothing leaves the machine. Added because the e2e suite registers users, resets
  # passwords and fires shore-contact alerts at addresses like `e2e-...@example.com`,
  # and CONFIG_MODE=development does NOT suppress sending (only TestingConfig does, and
  # that is the unit-test path). Every run was therefore posting real mail to fake
  # recipients through the configured relay, generating bounce notifications and — the
  # part that actually matters — accumulating hard bounces against the sending domain's
  # reputation, which is how a transactional relay account gets throttled or suspended.
  #
  # Web UI at http://localhost:8025 shows the rendered HTML of each template, which is
  # also the only convenient way to eyeball an email during local development.
  mailpit:
    image: axllent/mailpit:latest
    container_name: kayak_mailpit
    ports:
      - "127.0.0.1:1025:1025"  # SMTP
      - "127.0.0.1:8025:8025"  # Web UI + HTTP API → http://localhost:8025
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: kayak_minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"  # Console UI → http://localhost:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kayak}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - ./storage/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/minio:latest
    container_name: kayak_minio_init
    # Bucket + public-read policy provisioning lives here, not in the app at request time
    # (M11 §4) — avatars/ and point-images/ are public-read (stable, cacheable URLs);
    # documents/ and point-images-private/ stay private, served only via
    # StorageService.presigned_url. Runtime credentials then only need object CRUD.
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/$$STORAGE_BUCKET &&
        mc anonymous set download local/$$STORAGE_BUCKET/avatars &&
        mc anonymous set download local/$$STORAGE_BUCKET/point-images
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kayak}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-kayak}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  migrate:
    build:
      context: ./backend
      target: runtime
    container_name: kayak_migrate
    # Seeding moved here from app-factory time (M11 §4) — it used to run inside createApp(),
    # which every gunicorn worker AND the migrate/Celery processes call, racing identical
    # inserts at cold start. `flask seed` is idempotent and runs exactly once, after the
    # schema is current.
    command: sh -c "alembic upgrade head && flask seed"
    environment:
      CONFIG_MODE: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-kayak}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kayak_dev}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/.venv
    restart: "no"

  backend:
    build:
      context: ./backend
      target: runtime
    container_name: kayak_backend
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      CONFIG_MODE: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-kayak}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kayak_dev}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      LIVE_REDIS_URL: ${LIVE_REDIS_URL:-redis://redis:6379/3}
      REVOCATION_REDIS_URL: ${REVOCATION_REDIS_URL:-redis://redis:6379/4}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # setup_logfire() (Api/observability.py) reads this unconditionally on every
      # createApp() call — unset here, it silently no-ops (send_to_logfire=
      # "if-token-present"), so a real LOGFIRE_TOKEN in your shell/.env never actually
      # reaches any container without this line, even though the app "worked" either way.
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
      # Hardcoded to the local sink, deliberately NOT ${MAIL_SERVER:-...}: the whole point
      # is that a real relay host sitting in .env for production cannot leak into the dev
      # or e2e stack and start posting mail to fake test recipients. Same reasoning as
      # STORAGE_ENDPOINT being pinned to the local MinIO below. To exercise a real relay,
      # do it against the deployed box, not here.
      MAIL_SERVER: mailpit
      MAIL_PORT: 1025
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-noreply@kayakplanner.app}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:9000}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-kayak}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-kayak}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/.venv
    healthcheck:
      # No curl in the runtime image (python:3.12-slim + only libpq-dev/gcc/libmagic1) —
      # urllib is stdlib. GET /api/v1/health pings the DB (M11 §4).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sse:
    build:
      context: ./backend
      target: runtime
    container_name: kayak_sse
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      CONFIG_MODE: development
      SERVICE_ROLE: sse
      DATABASE_URL: postgresql://${POSTGRES_USER:-kayak}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kayak_dev}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      LIVE_REDIS_URL: ${LIVE_REDIS_URL:-redis://redis:6379/3}
      REVOCATION_REDIS_URL: ${REVOCATION_REDIS_URL:-redis://redis:6379/4}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # setup_logfire() (Api/observability.py) reads this unconditionally on every
      # createApp() call — unset here, it silently no-ops (send_to_logfire=
      # "if-token-present"), so a real LOGFIRE_TOKEN in your shell/.env never actually
      # reaches any container without this line, even though the app "worked" either way.
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
      # Hardcoded to the local sink, deliberately NOT ${MAIL_SERVER:-...}: the whole point
      # is that a real relay host sitting in .env for production cannot leak into the dev
      # or e2e stack and start posting mail to fake test recipients. Same reasoning as
      # STORAGE_ENDPOINT being pinned to the local MinIO below. To exercise a real relay,
      # do it against the deployed box, not here.
      MAIL_SERVER: mailpit
      MAIL_PORT: 1025
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-noreply@kayakplanner.app}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:9000}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-kayak}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-kayak}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/.venv
    healthcheck:
      # Same probe as backend — the sidecar serves the whole Flask app (D1); routing
      # via nginx/the reverse proxy is what isolates it to SSE routes, not the process.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ./backend
      target: runtime
    container_name: kayak_worker
    command: celery -A celery_worker worker --loglevel=info
    environment:
      CONFIG_MODE: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-kayak}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kayak_dev}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      LIVE_REDIS_URL: ${LIVE_REDIS_URL:-redis://redis:6379/3}
      REVOCATION_REDIS_URL: ${REVOCATION_REDIS_URL:-redis://redis:6379/4}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # setup_logfire() (Api/observability.py) reads this unconditionally on every
      # createApp() call — unset here, it silently no-ops (send_to_logfire=
      # "if-token-present"), so a real LOGFIRE_TOKEN in your shell/.env never actually
      # reaches any container without this line, even though the app "worked" either way.
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
      # Hardcoded to the local sink, deliberately NOT ${MAIL_SERVER:-...}: the whole point
      # is that a real relay host sitting in .env for production cannot leak into the dev
      # or e2e stack and start posting mail to fake test recipients. Same reasoning as
      # STORAGE_ENDPOINT being pinned to the local MinIO below. To exercise a real relay,
      # do it against the deployed box, not here.
      MAIL_SERVER: mailpit
      MAIL_PORT: 1025
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-noreply@kayakplanner.app}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CHECKPOINT_ALERT_HOURS: ${CHECKPOINT_ALERT_HOURS:-6}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:9000}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-kayak}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-kayak}
    depends_on:
      mailpit:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      target: runtime
    container_name: kayak_beat
    # --schedule points at /tmp — /app is owned by root (WORKDIR predates the
    # Dockerfile's `useradd`/COPY --chown), so appuser can't create the
    # persistent schedule DB file there.
    command: celery -A celery_worker beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      CONFIG_MODE: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-kayak}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kayak_dev}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      LIVE_REDIS_URL: ${LIVE_REDIS_URL:-redis://redis:6379/3}
      REVOCATION_REDIS_URL: ${REVOCATION_REDIS_URL:-redis://redis:6379/4}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # setup_logfire() (Api/observability.py) reads this unconditionally on every
      # createApp() call — unset here, it silently no-ops (send_to_logfire=
      # "if-token-present"), so a real LOGFIRE_TOKEN in your shell/.env never actually
      # reaches any container without this line, even though the app "worked" either way.
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
      # Hardcoded to the local sink, deliberately NOT ${MAIL_SERVER:-...}: the whole point
      # is that a real relay host sitting in .env for production cannot leak into the dev
      # or e2e stack and start posting mail to fake test recipients. Same reasoning as
      # STORAGE_ENDPOINT being pinned to the local MinIO below. To exercise a real relay,
      # do it against the deployed box, not here.
      MAIL_SERVER: mailpit
      MAIL_PORT: 1025
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-noreply@kayakplanner.app}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:9000}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-kayak}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-kayak}
    depends_on:
      mailpit:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
