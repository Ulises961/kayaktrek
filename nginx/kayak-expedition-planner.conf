# nginx server blocks for the Kayak Expedition Planner (ADR-034).
#
# Install: substitute the real domain for the kayak.example.com placeholder below (one
# global find-replace covers every server_name and the cert path, since the cert
# directory is also named after the apex host — see the certbot command further down),
# then copy to /etc/nginx/sites-available/kayak-expedition-planner.conf on the box,
# symlink into sites-enabled, `nginx -t` to validate, then reload nginx. The real domain
# stays local-only, not committed here — it's independently discoverable via Certificate
# Transparency logs the moment the cert issues regardless, so this isn't secrecy, just
# keeping the file a portable template rather than tied to one specific box's identity.
#
#   sed -i 's/kayak\.example\.com/<real-domain>/g' kayak-expedition-planner.conf
#
# Four server blocks, not one path-based vhost — frontend/backend/SSE are three separate
# origins by design (frontend/CLAUDE.md, ADR-033: different gunicorn process, separate
# NEXT_PUBLIC_API_URL/NEXT_PUBLIC_SSE_URL, CORS/CSP built around cross-origin
# fetch/EventSource calls), so nginx mirrors that instead of introducing a second,
# path-based routing scheme the app doesn't otherwise assume. The fourth, storage, exists
# because public-read avatars/point-images and presigned document downloads are served
# directly from MinIO's S3 API (`StorageService`, security review HIGH item) — the
# browser fetches those URLs straight from MinIO, not proxied through Flask, so MinIO
# needs its own public hostname. Only MinIO's S3 API port (9000) gets a vhost; its admin
# console (9001) stays 127.0.0.1-only, same as every other admin UI on this box.
#
# TLS terminates twice: Cloudflare's edge terminates public TLS for the browser, and
# Cloudflare Tunnel (cloudflared) re-encrypts the hop from itself to nginx on the box's
# own loopback (defense-in-depth on the loopback hop, not strictly required by Tunnel
# itself). nginx presents a real, publicly-trusted Let's Encrypt certificate obtained via
# certbot's DNS-01 challenge (certbot-dns-cloudflare) rather than a Cloudflare Origin
# Certificate — same automated-renewal path as every other domain already running on this
# box, and no reliance on cloudflared's special-cased trust of Cloudflare's own Origin CA.
# DNS-01 needs no port 80 exposure (there is none), so issuance/renewal doesn't depend on
# nginx or the app being up at all. cloudflared's ingress config points each hostname at
# https://localhost and sets originServerName to match the server_name below so SNI picks
# the right block.
#
# Cert install path on the box: one cert with all four hostnames as SANs, issued via
#   certbot certonly --dns-cloudflare --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
#     -d kayak.example.com -d api.kayak.example.com -d live.kayak.example.com \
#     -d storage.kayak.example.com
# — lives at /etc/letsencrypt/live/kayak.example.com/{fullchain,privkey}.pem (named
# after the first -d domain, the apex). A renewal-hooks/deploy script reloads nginx
# after each renewal since nginx won't notice the files changing on its own.
#
# Frontend lives at the bare apex, not an app. subdomain — there is no separate
# marketing site here (landing page, auth, and the authenticated dashboard are all
# the same Next.js deployment), so an app. prefix would just be an extra subdomain
# for something that isn't actually split out. Cloudflare's CNAME flattening makes
# the tunnel's route work at the zone apex the same as any subdomain.

# --- Frontend (Next.js) ---
server {
    listen 443 ssl;
    server_name kayak.example.com;

    ssl_certificate     /etc/letsencrypt/live/kayak.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kayak.example.com/privkey.pem;

    location / {
        # Host port 3300, not the container's default 3000 — 3000 is already taken by
        # another app on this box (docker-compose.prod.yml maps the frontend container's
        # internal :3000 to host :3300 to avoid the collision).
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Backend API (Flask main app) ---
server {
    listen 443 ssl;
    server_name api.kayak.example.com;

    ssl_certificate     /etc/letsencrypt/live/kayak.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kayak.example.com/privkey.pem;

    # Default (1m) is tight for avatar/point-image/document uploads that pass through
    # the app rather than going direct-to-MinIO via a presigned URL. Adjust if real
    # upload failures show a 413.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- SSE sidecar (live position stream, ADR-033) ---
# Needs its own tuning, not the defaults above: SSE connections are long-lived and
# streamed, which nginx's normal buffering/timeout defaults actively break.
server {
    listen 443 ssl;
    server_name live.kayak.example.com;

    ssl_certificate     /etc/letsencrypt/live/kayak.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kayak.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx buffers upstream responses by default, holding each event back until
        # the buffer fills or the connection closes — the opposite of what a live
        # stream needs.
        proxy_buffering off;
        proxy_cache off;
        # Default proxy_read_timeout (60s) would kill an idle-but-open SSE connection
        # well before the app's own 15s heartbeat tick would ever need it to.
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
        proxy_set_header Connection '';
    }
}

# --- Object storage (MinIO S3 API only — the admin console stays private) ---
# Serves public-read avatars/point-images and presigned document/private-image downloads
# directly to the browser (StorageService.presigned_url) — this traffic bypasses Flask
# entirely, so it needs its own public path through nginx, not just the backend vhost's.
# client_max_body_size/buffering settings follow MinIO's own documented reverse-proxy
# guidance: uploads/downloads must pass through unbuffered and unrewritten, and the
# default nginx body-size cap is far too small for this endpoint (unlike the backend
# vhost's 20m, which only bounds requests that flow through the Flask app itself).
server {
    listen 443 ssl;
    server_name storage.kayak.example.com;

    ssl_certificate     /etc/letsencrypt/live/kayak.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kayak.example.com/privkey.pem;

    client_max_body_size 0;
    ignore_invalid_headers off;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;
    }
}
