<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Back shortly — Kayaktrek</title>
<!--
  Served by nginx while /var/www/kayak-maintenance/maintenance.flag exists (M33 WP1).
  Self-contained on purpose: no asset, font or script is fetched, because every origin
  that could serve one is stopped while this page is up. Colours are inlined for the same
  reason — the app's design tokens live in a stylesheet this page cannot reach.
-->
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 0 16px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f1ea;
    color: #1f2a33;
  }
  main { max-width: 28rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
  p { line-height: 1.5; margin: 0 0 0.75rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #14202a; color: #e8e4da; }
  }
</style>
</head>
<body>
<main>
  <h1>Back in a minute</h1>
  <p>Kayaktrek is being updated. Nothing you saved is lost.</p>
  <p>This page will not refresh itself — try again in a minute or two.</p>
</main>
</body>
</html>
