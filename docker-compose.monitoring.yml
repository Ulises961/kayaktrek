# Box-level operator tooling — container management, hardware stats, DB browsing.
# Deliberately separate from docker-compose.prod.yml: independent lifecycle, so a
# `docker compose -f docker-compose.prod.yml pull && up -d` app redeploy never touches
# this stack (or vice versa). Bring up with:
#   docker compose -f docker-compose.prod.yml up -d      # creates the shared `kayak_net` first
#   docker compose -f docker-compose.monitoring.yml up -d portainer glances pgweb
# All UIs stay on 127.0.0.1 only, same as every other infra service in this repo — none
# of these are ever routed through the public Cloudflare Tunnel domain.

# The separate lifecycle above was only ever a claim, not a fact, until this `name:` existed.
# Both compose files live in the same directory on the box with no `-p`, so Compose derived
# the SAME project name (`kayak-planner`, from the directory) for both — which makes each
# file's services "orphans" of the other's view. `scripts/deploy.sh` runs the app stack with
# `up -d --remove-orphans`, so every single deploy silently DELETED portainer/glances/pgweb.
# Observed 2026-09-20: all three containers gone from `docker ps -a` after the prior deploy,
# with the app stack healthy. An explicit project name is what actually isolates the two.
name: kayak-monitoring

services:

  portainer:
    image: portainer/portainer-ce:latest
    container_name: kayak_portainer
    restart: unless-stopped
    ports:
      - "127.0.0.1:9002:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  # nicolargo/glances' documented Docker pattern: --pid host so it sees host processes,
  # --network host so network throughput is the host's real interface, not a container's
  # virtual veth. That bypasses `ports:` entirely, so the bind address must be pinned
  # explicitly — network host mode would otherwise listen on every host interface.
  glances:
    image: nicolargo/glances:latest
    container_name: kayak_glances
    restart: unless-stopped
    pid: host
    network_mode: host
    environment:
      GLANCES_OPT: "-w --bind 127.0.0.1 --port 61208"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: kayak_pgweb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      # sslmode=disable is required, not a shortcut: pgweb's driver (lib/pq) defaults to
      # `require`, and the postgis image doesn't serve TLS — without this pgweb restart-loops
      # on `pq: SSL is not enabled on the server`. The hop is container-to-container on
      # kayak_net and never leaves the box, so there's nothing on the wire to protect.
      PGWEB_DATABASE_URL: postgresql://${POSTGRES_USER:-kayak}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kayak_prod}?sslmode=disable

  # Uptime Kuma is deliberately not here. It used to be defined in this file and never started
  # on the droplet: the real instance runs on the operator's home box, because the one thing
  # Kuma is good for — noticing the droplet is gone — only works from somewhere else. A
  # definition nothing ran was a second, misleading source of truth, and it got copied to the
  # box on every sync. See DEPLOY.md "Uptime Kuma".

volumes:
  # Pinned to the name the old `kayak-planner` project gave it, so renaming the project
  # adopts the existing volume instead of starting a blank one — Portainer's admin account
  # lives in here, and it survived the deploy that removed the containers themselves.
  portainer_data:
    name: kayak-planner_portainer_data

networks:
  default:
    name: kayak_net
    external: true
