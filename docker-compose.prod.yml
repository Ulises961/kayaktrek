services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: kayak_rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: kayak_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kayak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-kayak_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kayak} -d ${POSTGRES_DB:-kayak_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kayak_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      # 6380, not 6379: the box also runs an apt-installed redis-server.service bound to
      # 127.0.0.1:6379, and whichever starts first at boot wins — losing that race killed
      # this container outright ("address already in use", exit 128), silently, on a reboot.
      # The app reaches redis as redis://redis:6379/N over kayak_net, so this host publish
      # is operator convenience only and can live on any free port.
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: kayak_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kayak}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - ./storage/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/minio:latest
    container_name: kayak_minio_init
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/$$STORAGE_BUCKET &&
        mc anonymous set download local/$$STORAGE_BUCKET/avatars &&
        mc anonymous set download local/$$STORAGE_BUCKET/point-images
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kayak}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-kayak}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  migrate:
    image: ghcr.io/ulises961/kayak-expedition-planner-backend:latest
    container_name: kayak_migrate
    command: sh -c "alembic upgrade head && flask seed"
    environment:
      CONFIG_MODE: ${CONFIG_MODE:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kayak}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kayak_prod}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # StagingConfig/ProductionConfig both require this at class-definition time
      # (os.environ[...], no default, M11 rate-limit hardening) - just importing the
      # Flask app for `flask seed` crashes without it, even though migrate itself
      # never handles a rate-limited request.
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    image: ghcr.io/ulises961/kayak-expedition-planner-backend:latest
    container_name: kayak_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      CONFIG_MODE: ${CONFIG_MODE:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kayak}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kayak_prod}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      LIVE_REDIS_URL: ${LIVE_REDIS_URL:-redis://redis:6379/3}
      REVOCATION_REDIS_URL: ${REVOCATION_REDIS_URL:-redis://redis:6379/4}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-noreply@kayakplanner.app}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:?STORAGE_PUBLIC_URL is required}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-kayak}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-kayak}
      # The box's host-level nginx (registers every app running there) is already one
      # proxy hop in front of this, so this is 1, not 0, even before Cloudflare Tunnel
      # exists — bump to 2 once Tunnel (ADR-034 point 3) is added in front of nginx too,
      # so ProxyFix resolves the real client IP from the outermost trusted hop, not
      # nginx's own address.
      PROXY_TRUSTED_HOPS: ${PROXY_TRUSTED_HOPS:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sse:
    image: ghcr.io/ulises961/kayak-expedition-planner-backend:latest
    container_name: kayak_sse
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      CONFIG_MODE: ${CONFIG_MODE:-production}
      SERVICE_ROLE: sse
      DATABASE_URL: postgresql://${POSTGRES_USER:-kayak}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kayak_prod}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      LIVE_REDIS_URL: ${LIVE_REDIS_URL:-redis://redis:6379/3}
      REVOCATION_REDIS_URL: ${REVOCATION_REDIS_URL:-redis://redis:6379/4}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-noreply@kayakplanner.app}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:?STORAGE_PUBLIC_URL is required}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-kayak}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-kayak}
      # The box's host-level nginx (registers every app running there) is already one
      # proxy hop in front of this, so this is 1, not 0, even before Cloudflare Tunnel
      # exists — bump to 2 once Tunnel (ADR-034 point 3) is added in front of nginx too,
      # so ProxyFix resolves the real client IP from the outermost trusted hop, not
      # nginx's own address.
      PROXY_TRUSTED_HOPS: ${PROXY_TRUSTED_HOPS:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    image: ghcr.io/ulises961/kayak-expedition-planner-backend:latest
    container_name: kayak_worker
    restart: unless-stopped
    command: celery -A celery_worker worker --loglevel=info
    environment:
      CONFIG_MODE: ${CONFIG_MODE:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kayak}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kayak_prod}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      LIVE_REDIS_URL: ${LIVE_REDIS_URL:-redis://redis:6379/3}
      REVOCATION_REDIS_URL: ${REVOCATION_REDIS_URL:-redis://redis:6379/4}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-noreply@kayakplanner.app}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:?STORAGE_PUBLIC_URL is required}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-kayak}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-kayak}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  beat:
    image: ghcr.io/ulises961/kayak-expedition-planner-backend:latest
    container_name: kayak_beat
    restart: unless-stopped
    command: celery -A celery_worker beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      CONFIG_MODE: ${CONFIG_MODE:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kayak}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kayak_prod}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      LIVE_REDIS_URL: ${LIVE_REDIS_URL:-redis://redis:6379/3}
      REVOCATION_REDIS_URL: ${REVOCATION_REDIS_URL:-redis://redis:6379/4}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-noreply@kayakplanner.app}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      CHECKPOINT_ALERT_HOURS: ${CHECKPOINT_ALERT_HOURS:-6}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:?STORAGE_PUBLIC_URL is required}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-kayak}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-kayak}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # Doesn't exist in docker-compose.yml — dev runs the frontend via `pnpm dev` locally.
  # NEXT_PUBLIC_* values are already baked into this image at build time (frontend-ci.yml);
  # nothing here can change them at runtime.
  frontend:
    image: ghcr.io/ulises961/kayak-expedition-planner-frontend:latest
    container_name: kayak_frontend
    restart: unless-stopped
    ports:
      # Host 3300, not 3000 — 3000 is already taken by another app on this box. The
      # container's internal port stays 3000 (that's what the Next.js server inside it
      # actually listens on); only the host-side mapping changes, and nginx's proxy_pass
      # for the frontend vhost points at 3300 to match.
      - "127.0.0.1:3300:3000"
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  # Named + fixed so docker-compose.monitoring.yml (pgweb specifically, to resolve
  # `postgres` by service name) can join it as an external network without the two
  # compose files needing to be brought up together or share a lifecycle.
  default:
    name: kayak_net
