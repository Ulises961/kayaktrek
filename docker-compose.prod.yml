# Memory limits — every service is capped. Nothing here was, so a single leaking process
# could take the whole box down with it, and on a one-box deployment "the whole box" includes
# Postgres. These are *runaway catchers*, not budgets: each is set well above the service's
# expected steady state, so normal traffic never touches them and only a process that has
# genuinely lost control gets killed. Consequence worth stating plainly: the limits sum to
# more than the host's RAM on purpose. They stop one container eating everything; they do not
# stop every container growing at once, which is what the free-RAM headroom is for.
#
# Written as `deploy.resources.limits` (the Compose Spec form) rather than the legacy
# `mem_limit`. Both were verified to actually apply under `docker compose` v5 in non-swarm
# mode — `deploy:` reads as swarm-only, and a limit that silently does nothing is worse than
# no limit, because you think you are covered.
#
# CPU limits are deliberately absent. Memory is the failure mode here — an OOM takes the box,
# while CPU contention just makes things slow, and a `cpus:` cap set too low on a 2-vCPU
# droplet would throttle normal work to prevent a problem that has not happened.
#
# Log rotation — every service gets it, found missing 2026-09-07. Neither this file nor the
# droplet's Docker daemon set any log-driver options, so every container's stdout (gunicorn's
# access logs on `backend`/`worker`/`beat`/`sse` included, which log the client IP on every
# request) was writing to the default `json-file` driver with no size cap and no expiry —
# unbounded growth on disk, and a privacy-policy retention claim `docker-compose.prod.yml`
# could not actually back up. `max-size`/`max-file` bounds it per-container (30M total here);
# an in-compose default rather than a Docker-daemon-wide one in `/etc/docker/daemon.json`
# because it's git-tracked infra-as-code deployed the same way as everything else in this
# file, and a compose change only restarts the containers it touches — a daemon-level change
# would restart the whole box's Docker daemon, every container at once, for no reason tied to
# this fix.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: kayak_rabbitmq
    # Also fixes something beyond the cap: RabbitMQ's own vm_memory_high_watermark defaults
    # to 0.4 of what it believes total memory to be, and an uncapped container believes that
    # is the *host's* RAM. It reads the cgroup limit when one exists, so setting this makes
    # RabbitMQ start blocking publishers at 0.4 x 512M rather than 0.4 x the whole droplet.
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: kayak_postgres
    # The most generous cap in the file, and deliberately so: this is the one container
    # whose death is unrecoverable rather than merely disruptive. 1G is several times the
    # expected footprint (128M shared_buffers plus per-connection overhead), so it only
    # fires on something genuinely pathological.
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kayak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-kayak_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kayak} -d ${POSTGRES_DB:-kayak_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kayak_redis
    restart: unless-stopped
    logging: *default-logging
    # 384M against redis's own 256mb maxmemory below — the gap is allocator fragmentation
    # and copy-on-write, which is why the container cap has to sit above the internal one
    # rather than match it.
    #
    # Everything on this instance must be disposable under LRU eviction: limiter counters,
    # cached weather, Celery results, and live-position pub/sub (which stores no keys at
    # all). The revoked-session denylist used to be here on /4 and is not any more — see
    # the redis-auth service below.
    deploy:
      resources:
        limits:
          memory: 384M
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      # 6380, not 6379, so nothing on the host can contend for this bind. The app reaches
      # redis as redis://redis:6379/N over kayak_net; this publish is operator convenience
      # only, so it costs nothing to keep it off the port every other redis defaults to.
      # Worth keeping even though the specific collision is gone: an apt redis-server was
      # bound to 127.0.0.1:6379 on the box, and whichever of the two started first at boot
      # won — the reboot this container lost, it died with "address already in use" (exit
      # 128) and stayed down, taking cache, rate limiting, Celery results and live positions
      # with it. Nothing surfaced that; the stack just looked up. That package has since
      # been removed, but a port a package manager can hand out again is not a port to
      # depend on being free.
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The revoked-session denylist (M17 / ADR-035) gets its own Redis, and the reason is
  # eviction policy, not load. The shared instance above runs `allkeys-lru`, and Redis
  # applies maxmemory and eviction **instance-wide, across every logical DB** — so under
  # memory pressure it would pick victims from the denylist just as readily as from the
  # cache.
  #
  # Worse, it would pick them *first*. LRU ranks by last access, and a denylist key is
  # written once at sign-out and then read only if that revoked device presents its token
  # again — which, for a device someone has just signed out, is usually never. Limiter and
  # cache keys are touched constantly and stay hot. So the one key whose loss has a security
  # consequence is reliably the coldest thing in the instance.
  #
  # And the consequence is silent: SessionService.is_revoked fails open, so an evicted key
  # reads as "not revoked" and a signed-out device's access token starts working again for
  # the rest of its 15-minute life. No error, no log, nothing to notice.
  #
  # No eviction policy fixes this — the denylist is write-once/read-rarely by construction,
  # so allkeys-lru, allkeys-lfu and volatile-ttl all rank it first. Isolation is the fix.
  # Here `noeviction` is correct rather than dangerous: keys are ~40 bytes with a 15-minute
  # TTL, so 64mb is orders of magnitude more than a realistic revocation burst needs and the
  # policy never fires. If it somehow did, a failed write is already handled — logged, with
  # the session row still revoked, so refresh is dead either way.
  #
  # Deliberately not persisted, matching the instance above: a restart drops the denylist and
  # recently-revoked-but-unexpired tokens work again for <=15 minutes. That is the same
  # degradation the fail-open read path already accepts, and AOF fsync is the disk I/O
  # ADR-016's Redis design exists to avoid. Noted so it stays a decision, not an oversight.
  redis-auth:
    image: redis:7-alpine
    container_name: kayak_redis_auth
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
    command: >
      redis-server
      --maxmemory 64mb
      --maxmemory-policy noeviction
      --save ""
      --appendonly no
    ports:
      - "127.0.0.1:6383:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: ghcr.io/ulises961/kayak-expedition-planner-backend:${KAYAK_IMAGE_TAG:-latest}
    container_name: kayak_migrate
    logging: *default-logging
    # Same budget as `backend`'s idle figure, not the smaller one a one-shot job looks like
    # it deserves: `flask seed` calls createApp(), so this pays the full app-factory cost —
    # every blueprint and model, plus apispec resolving the whole OpenAPI spec — on top of
    # alembic. 512M OOM-killed it (exit 137) part-way through the factory, *after* alembic
    # had already committed, leaving the schema upgraded but unseeded and reporting only
    # "exit 137". Worth over-provisioning to keep that failure out of a deploy.
    deploy:
      resources:
        limits:
          memory: 768M
    command: sh -c "alembic upgrade head && flask seed"
    environment:
      CONFIG_MODE: ${CONFIG_MODE:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kayak}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kayak_prod}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # StagingConfig/ProductionConfig both require this at class-definition time
      # (os.environ[...], no default, M11 rate-limit hardening) - just importing the
      # Flask app for `flask seed` crashes without it, even though migrate itself
      # never handles a rate-limited request.
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      # Alembic revision d4e8b03c1f27 renormalises every stored object URL against the
      # configured storage base, so `migrate` needs the same STORAGE_* view as the app.
      # It previously had none: the migration would have fallen back to the local-MinIO
      # defaults and rewritten every avatar and route photo to a dead host. The migration
      # now also refuses to run on defaults when CONFIG_MODE is production/staging, so
      # this omission cannot recur silently.
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:?STORAGE_PUBLIC_URL is required}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-kayak}
      STORAGE_BUCKET_PUBLIC: ${STORAGE_BUCKET_PUBLIC:-}
      STORAGE_BUCKET_PRIVATE: ${STORAGE_BUCKET_PRIVATE:-}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-auth:
        condition: service_healthy
    restart: "no"

  backend:
    image: ghcr.io/ulises961/kayak-expedition-planner-backend:${KAYAK_IMAGE_TAG:-latest}
    container_name: kayak_backend
    restart: unless-stopped
    logging: *default-logging
    # gunicorn master + 2 sync workers (entrypoint.sh). Measured idle 281 MiB, and it stays
    # there under marine-field requests now that Services/Utils/land_mask.py mmaps the land
    # mask instead of resident-loading it — a 24x24 grid touches ~2 MB of reclaimable page
    # cache. This cap briefly had to be 2560M to cover the ~890 MiB per-worker spike that
    # replaced.
    deploy:
      resources:
        limits:
          memory: 768M
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      # Medical notes, parked 2026-09-02 (docs/adr/safety-privacy.md "Parked"). Passed
      # through rather than pinned so unparking the server half is one line in .env.prod —
      # but that alone is not enough: the client flag is inlined into the frontend bundle at
      # build time, so unparking also needs an image rebuilt with
      # NEXT_PUBLIC_MEDICAL_NOTES=true, and the privacy policy's health-data section back.
      # Empty/unset — the state this box runs in — 404s all nine endpoints.
      MEDICAL_NOTES_ENABLED: ${MEDICAL_NOTES_ENABLED:-}
      # Open-Meteo commercial plan (M32). Blank keeps the free-tier hosts; the service reads
      # these with `or`, so the empty string compose writes for an unset var is safe. Needed
      # here for the global wind grid, fetched in-request, and on `worker` for per-day fetches.
      OPEN_METEO_WEATHER_BASE_URL: ${OPEN_METEO_WEATHER_BASE_URL:-}
      OPEN_METEO_MARINE_BASE_URL: ${OPEN_METEO_MARINE_BASE_URL:-}
      OPEN_METEO_API_KEY: ${OPEN_METEO_API_KEY:-}
      # Who may use a paid integration (M41). Blank keeps the built-in provider, which says no
      # to everyone; needed on `backend` for the weather-refresh route and on `worker` for the
      # forecast horizon.
      ENTITLEMENT_PROVIDER: ${ENTITLEMENT_PROVIDER:-}
      PREMIUM_FEATURES_OPEN: ${PREMIUM_FEATURES_OPEN:-}
      # M29 satellite-feed credentials, encrypted at rest with AES-GCM under this key
      # (Services/Utils/server_secret_crypto.py). Needed on `backend`, which encrypts on
      # create/update, and on `worker`, which decrypts on every poll — not on `beat`, which
      # only dispatches the task name, nor `sse`, which never touches feeds.
      #
      # Blank-defaulted rather than required: a Garmin inReach MapShare feed needs no
      # password, so the key is only read for a feed that has one, and `_key()` raises
      # rather than failing quietly when it is missing. Requiring it would block every
      # deploy over a key most installs never use.
      #
      # It was absent here entirely until now, which is the actual bug: `environment:` is
      # the only path into these containers (no `env_file:`), so a value set in .env.prod
      # was discarded and no operator action could fix it. Same shape as INVITE_CODE (see
      # the conventions doc) and M32's OPEN_METEO_* vars — three instances of one pattern.
      FEED_CREDENTIAL_KEY: ${FEED_CREDENTIAL_KEY:-}
      # Shared with the `frontend` service, and only with it. Sign-in and refresh arrive
      # from a Next server action, so this request's own User-Agent is Node's and its
      # address is this machine's; the frontend forwards the browser's under X-Client-* and
      # proves it with this secret. Unset means "do not trust those headers at all" — never
      # "trust anyone who sends them", which would let a stolen session dress itself up as
      # the owner's own laptop in the one list built to catch exactly that.
      # Needed only here: the labels are written on login and refresh, and `worker`, `beat`
      # and `sse` never handle a client request.
      CLIENT_FORWARDING_SECRET: ${CLIENT_FORWARDING_SECRET:-}
      # Closed-beta registration gate (PR #160). This line was missing until M25 §1, and
      # `environment:` is the only path into these containers — there is no `env_file:` in
      # this compose file — so the backend has always received an empty INVITE_CODE, and
      # `_invite_code_valid` treats empty as "no gate". The gate has therefore never been
      # active in production, whatever the conventions doc said; registration has been open since
      # #160 shipped.
      #
      # Left empty here, because M25 opens registration deliberately. What the line buys is
      # the kill switch: set INVITE_CODE in .env.prod and restart the backend to shut new
      # signups behind a code, with no image rebuild (unlike the NEXT_PUBLIC_* flags, which
      # are baked in at build). See DEPLOY.md "Closing registration in a hurry".
      INVITE_CODE: ${INVITE_CODE:-}
      # Local disk, not the object store — see Services/tile_cache.py. The proxy re-serves
      # tile bytes through Flask, so the browser never fetches them from R2 and every cache
      # *hit* was paying a WAN round trip for nothing.
      TILE_CACHE_DIR: /var/cache/kayak/tiles
      # A blast-radius control, not a cost control: this filesystem is shared with Postgres,
      # and a full disk stops it writing WAL. Being stingy is counterproductive — eviction
      # pressure pushes load back onto OpenStreetMap's tile servers. 0 disables the cap.
      TILE_CACHE_MAX_BYTES: ${TILE_CACHE_MAX_BYTES:-5368709120}
      TILE_CACHE_MIN_FREE_BYTES: ${TILE_CACHE_MIN_FREE_BYTES:-10737418240}
      # Points land_mask.py at the mounted volume so the ~890 MiB decompression is paid
      # once ever, not once per container start. Unset it and the module uses a temp dir.
      LAND_MASK_CACHE_DIR: /var/cache/kayak/land-mask
      CONFIG_MODE: ${CONFIG_MODE:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kayak}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kayak_prod}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      LIVE_REDIS_URL: ${LIVE_REDIS_URL:-redis://redis:6379/3}
      # Its own instance, not a DB on the shared one — see the redis-auth service for why.
      # DB 0 because a single-purpose instance has no other tenants to number around.
      #
      # Hardcoded rather than ${REVOCATION_REDIS_URL:-...}, breaking this file's usual
      # env-driven pattern on purpose. `:-` substitutes only when the var is *unset*, so any
      # REVOCATION_REDIS_URL left in .env silently wins — and this one is not a free
      # deployment choice: the target must be an instance that does not evict, or the
      # denylist gets dropped under memory pressure and signed-out devices come back to life
      # for the rest of their 15-minute token. The dev stack demonstrated exactly that
      # failure, and it presents as nothing at all: healthy containers, key in the wrong
      # place. Pointing this at an external/managed Redis later is a one-line change here,
      # which is reviewable in a way an .env override is not.
      REVOCATION_REDIS_URL: redis://redis-auth:6379/0
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-noreply@kayakplanner.app}
      # Rendered in the email footer when set, omitted when not (Api/config.py). Blank by
      # default on purpose — publishing a postal address is a trader-identity decision
      # (DSA), not a template default. Declared here so the operator *can* set it:
      # `environment:` is the only path into these containers.
      MAIL_POSTAL_ADDRESS: ${MAIL_POSTAL_ADDRESS:-}
      # Brevo's HTTP API, used instead of the SMTP config above when set — DigitalOcean
      # blocks outbound SMTP unconditionally on every droplet (confirmed 2026-09-06), so
      # this is the actual transport in production. See Services/mail_service.py.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      # Required, with no fallback: MinIO is no longer in this file, so there is nothing
      # local to default to. An unset STORAGE_ENDPOINT must refuse to start rather than
      # silently point at a service that does not exist.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?STORAGE_ENDPOINT is required}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:?STORAGE_PUBLIC_URL is required}
      # Required, not defaulted. This used to be ${MINIO_ROOT_USER:-kayak}; a bare `kayak`
      # default would let a box start with the wrong access key and fail to authenticate at
      # runtime instead of at boot — a silent misconfiguration is worse than a refusal.
      # Production does not get guessy defaults for credentials; docker-compose.yml keeps
      # the local-MinIO convenience.
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-kayak}
      # Two-bucket split (R2). Unset = both fall back to STORAGE_BUCKET, i.e. MinIO
      # behaviour unchanged. Compose writes an unset var as an empty string rather than
      # omitting it, which is why the app reads these with `or` and not a get() default.
      STORAGE_BUCKET_PUBLIC: ${STORAGE_BUCKET_PUBLIC:-}
      STORAGE_BUCKET_PRIVATE: ${STORAGE_BUCKET_PRIVATE:-}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
      # The box's host-level nginx (registers every app running there) is already one
      # proxy hop in front of this, so this is 1, not 0, even before Cloudflare Tunnel
      # exists — bump to 2 once Tunnel (ADR-034 point 3) is added in front of nginx too,
      # so ProxyFix resolves the real client IP from the outermost trusted hop, not
      # nginx's own address.
      PROXY_TRUSTED_HOPS: ${PROXY_TRUSTED_HOPS:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-auth:
        condition: service_healthy
    healthcheck:
      # busybox wget, not Python: an interpreter start every 10s scans the venv's whole
      # site-packages and keeps `docker stats` reading near the limit with reclaimable kernel
      # slab (real usage is memory.stat's `anon`). 127.0.0.1, not localhost: gunicorn binds
      # IPv4 only, and busybox tries ::1 first. Non-2xx exits 1.
      test: ["CMD", "busybox", "wget", "-q", "-O", "/dev/null", "-T", "5", "http://127.0.0.1:5000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - tile_cache:/var/cache/kayak/tiles
      # Persists Services/Utils/land_mask.py's decompressed land mask (~890 MiB) across
      # restarts. Without it every container start re-streams it out of the package .npz.
      - land_mask_cache:/var/cache/kayak/land-mask

  sse:
    image: ghcr.io/ulises961/kayak-expedition-planner-backend:${KAYAK_IMAGE_TAG:-latest}
    container_name: kayak_sse
    restart: unless-stopped
    logging: *default-logging
    # One gevent worker holding up to 200 concurrent connections. Greenlets are cheap
    # individually, but this is the container whose footprint scales with *viewers* rather
    # than with request rate, so it gets its own headroom.
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      CONFIG_MODE: ${CONFIG_MODE:-production}
      SERVICE_ROLE: sse
      DATABASE_URL: postgresql://${POSTGRES_USER:-kayak}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kayak_prod}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      LIVE_REDIS_URL: ${LIVE_REDIS_URL:-redis://redis:6379/3}
      # Its own instance, not a DB on the shared one — see the redis-auth service for why.
      # DB 0 because a single-purpose instance has no other tenants to number around.
      #
      # Hardcoded rather than ${REVOCATION_REDIS_URL:-...}, breaking this file's usual
      # env-driven pattern on purpose. `:-` substitutes only when the var is *unset*, so any
      # REVOCATION_REDIS_URL left in .env silently wins — and this one is not a free
      # deployment choice: the target must be an instance that does not evict, or the
      # denylist gets dropped under memory pressure and signed-out devices come back to life
      # for the rest of their 15-minute token. The dev stack demonstrated exactly that
      # failure, and it presents as nothing at all: healthy containers, key in the wrong
      # place. Pointing this at an external/managed Redis later is a one-line change here,
      # which is reviewable in a way an .env override is not.
      REVOCATION_REDIS_URL: redis://redis-auth:6379/0
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-noreply@kayakplanner.app}
      # Rendered in the email footer when set, omitted when not (Api/config.py). Blank by
      # default on purpose — publishing a postal address is a trader-identity decision
      # (DSA), not a template default. Declared here so the operator *can* set it:
      # `environment:` is the only path into these containers.
      MAIL_POSTAL_ADDRESS: ${MAIL_POSTAL_ADDRESS:-}
      # Brevo's HTTP API, used instead of the SMTP config above when set — DigitalOcean
      # blocks outbound SMTP unconditionally on every droplet (confirmed 2026-09-06), so
      # this is the actual transport in production. See Services/mail_service.py.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      # Required, with no fallback: MinIO is no longer in this file, so there is nothing
      # local to default to. An unset STORAGE_ENDPOINT must refuse to start rather than
      # silently point at a service that does not exist.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?STORAGE_ENDPOINT is required}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:?STORAGE_PUBLIC_URL is required}
      # Required, not defaulted. This used to be ${MINIO_ROOT_USER:-kayak}; a bare `kayak`
      # default would let a box start with the wrong access key and fail to authenticate at
      # runtime instead of at boot — a silent misconfiguration is worse than a refusal.
      # Production does not get guessy defaults for credentials; docker-compose.yml keeps
      # the local-MinIO convenience.
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-kayak}
      # Two-bucket split (R2). Unset = both fall back to STORAGE_BUCKET, i.e. MinIO
      # behaviour unchanged. Compose writes an unset var as an empty string rather than
      # omitting it, which is why the app reads these with `or` and not a get() default.
      STORAGE_BUCKET_PUBLIC: ${STORAGE_BUCKET_PUBLIC:-}
      STORAGE_BUCKET_PRIVATE: ${STORAGE_BUCKET_PRIVATE:-}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
      # The box's host-level nginx (registers every app running there) is already one
      # proxy hop in front of this, so this is 1, not 0, even before Cloudflare Tunnel
      # exists — bump to 2 once Tunnel (ADR-034 point 3) is added in front of nginx too,
      # so ProxyFix resolves the real client IP from the outermost trusted hop, not
      # nginx's own address.
      PROXY_TRUSTED_HOPS: ${PROXY_TRUSTED_HOPS:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-auth:
        condition: service_healthy
    healthcheck:
      # busybox wget, not Python: an interpreter start every 10s scans the venv's whole
      # site-packages and keeps `docker stats` reading near the limit with reclaimable kernel
      # slab (real usage is memory.stat's `anon`). 127.0.0.1, not localhost: gunicorn binds
      # IPv4 only, and busybox tries ::1 first. Non-2xx exits 1.
      test: ["CMD", "busybox", "wget", "-q", "-O", "/dev/null", "-T", "5", "http://127.0.0.1:5000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    image: ghcr.io/ulises961/kayak-expedition-planner-backend:${KAYAK_IMAGE_TAG:-latest}
    container_name: kayak_worker
    restart: unless-stopped
    logging: *default-logging
    # Measured idle: 242 MiB, for the master plus 2 forked children.
    deploy:
      resources:
        limits:
          memory: 640M
    # --concurrency pinned, not left to Celery's default. That default is the host's CPU
    # count, so the number of forked child processes — and with it the container's whole
    # memory footprint — changes when the hardware does. Resizing the box for CPU headroom
    # would silently double this and spend the RAM the resize was meant to free. Every task
    # here is I/O-bound (SMTP, OpenMeteo, S3, Postgres), so concurrency tracks how many can
    # be in flight, not how many cores are free — 2 is the value being sized for.
    #
    # --max-tasks-per-child recycles a child after N tasks. Long-lived Celery workers
    # accumulate memory across tasks; this bounds that without needing to find the leak.
    command: celery -A celery_worker worker --loglevel=info --concurrency=2 --max-tasks-per-child=100
    environment:
      # Local disk, not the object store — see Services/tile_cache.py. The proxy re-serves
      # tile bytes through Flask, so the browser never fetches them from R2 and every cache
      # *hit* was paying a WAN round trip for nothing.
      TILE_CACHE_DIR: /var/cache/kayak/tiles
      # A blast-radius control, not a cost control: this filesystem is shared with Postgres,
      # and a full disk stops it writing WAL. Being stingy is counterproductive — eviction
      # pressure pushes load back onto OpenStreetMap's tile servers. 0 disables the cap.
      TILE_CACHE_MAX_BYTES: ${TILE_CACHE_MAX_BYTES:-5368709120}
      TILE_CACHE_MIN_FREE_BYTES: ${TILE_CACHE_MIN_FREE_BYTES:-10737418240}
      # Points land_mask.py at the mounted volume so the ~890 MiB decompression is paid
      # once ever, not once per container start. Unset it and the module uses a temp dir.
      LAND_MASK_CACHE_DIR: /var/cache/kayak/land-mask
      CONFIG_MODE: ${CONFIG_MODE:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kayak}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kayak_prod}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      LIVE_REDIS_URL: ${LIVE_REDIS_URL:-redis://redis:6379/3}
      # Its own instance, not a DB on the shared one — see the redis-auth service for why.
      # DB 0 because a single-purpose instance has no other tenants to number around.
      #
      # Hardcoded rather than ${REVOCATION_REDIS_URL:-...}, breaking this file's usual
      # env-driven pattern on purpose. `:-` substitutes only when the var is *unset*, so any
      # REVOCATION_REDIS_URL left in .env silently wins — and this one is not a free
      # deployment choice: the target must be an instance that does not evict, or the
      # denylist gets dropped under memory pressure and signed-out devices come back to life
      # for the rest of their 15-minute token. The dev stack demonstrated exactly that
      # failure, and it presents as nothing at all: healthy containers, key in the wrong
      # place. Pointing this at an external/managed Redis later is a one-line change here,
      # which is reviewable in a way an .env override is not.
      REVOCATION_REDIS_URL: redis://redis-auth:6379/0
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-noreply@kayakplanner.app}
      # Rendered in the email footer when set, omitted when not (Api/config.py). Blank by
      # default on purpose — publishing a postal address is a trader-identity decision
      # (DSA), not a template default. Declared here so the operator *can* set it:
      # `environment:` is the only path into these containers.
      MAIL_POSTAL_ADDRESS: ${MAIL_POSTAL_ADDRESS:-}
      # Brevo's HTTP API, used instead of the SMTP config above when set — DigitalOcean
      # blocks outbound SMTP unconditionally on every droplet (confirmed 2026-09-06), so
      # this is the actual transport in production. See Services/mail_service.py.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      # Open-Meteo commercial plan (M32) — see the matching block on `backend`.
      OPEN_METEO_WEATHER_BASE_URL: ${OPEN_METEO_WEATHER_BASE_URL:-}
      OPEN_METEO_MARINE_BASE_URL: ${OPEN_METEO_MARINE_BASE_URL:-}
      OPEN_METEO_API_KEY: ${OPEN_METEO_API_KEY:-}
      # Entitlement provider (M41) — see the matching block on `backend`.
      ENTITLEMENT_PROVIDER: ${ENTITLEMENT_PROVIDER:-}
      PREMIUM_FEATURES_OPEN: ${PREMIUM_FEATURES_OPEN:-}
      # M29 satellite-feed credentials, encrypted at rest with AES-GCM under this key
      # (Services/Utils/server_secret_crypto.py). Needed on `backend`, which encrypts on
      # create/update, and on `worker`, which decrypts on every poll — not on `beat`, which
      # only dispatches the task name, nor `sse`, which never touches feeds.
      #
      # Blank-defaulted rather than required: a Garmin inReach MapShare feed needs no
      # password, so the key is only read for a feed that has one, and `_key()` raises
      # rather than failing quietly when it is missing. Requiring it would block every
      # deploy over a key most installs never use.
      #
      # It was absent here entirely until now, which is the actual bug: `environment:` is
      # the only path into these containers (no `env_file:`), so a value set in .env.prod
      # was discarded and no operator action could fix it. Same shape as INVITE_CODE (see
      # the conventions doc) and M32's OPEN_METEO_* vars — three instances of one pattern.
      FEED_CREDENTIAL_KEY: ${FEED_CREDENTIAL_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      CHECKPOINT_ALERT_HOURS: ${CHECKPOINT_ALERT_HOURS:-6}
      # Required, with no fallback: MinIO is no longer in this file, so there is nothing
      # local to default to. An unset STORAGE_ENDPOINT must refuse to start rather than
      # silently point at a service that does not exist.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?STORAGE_ENDPOINT is required}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:?STORAGE_PUBLIC_URL is required}
      # Required, not defaulted. This used to be ${MINIO_ROOT_USER:-kayak}; a bare `kayak`
      # default would let a box start with the wrong access key and fail to authenticate at
      # runtime instead of at boot — a silent misconfiguration is worse than a refusal.
      # Production does not get guessy defaults for credentials; docker-compose.yml keeps
      # the local-MinIO convenience.
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-kayak}
      # Two-bucket split (R2). Unset = both fall back to STORAGE_BUCKET, i.e. MinIO
      # behaviour unchanged. Compose writes an unset var as an empty string rather than
      # omitting it, which is why the app reads these with `or` and not a get() default.
      STORAGE_BUCKET_PUBLIC: ${STORAGE_BUCKET_PUBLIC:-}
      STORAGE_BUCKET_PRIVATE: ${STORAGE_BUCKET_PRIVATE:-}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    volumes:
      - tile_cache:/var/cache/kayak/tiles
      # Persists Services/Utils/land_mask.py's decompressed land mask (~890 MiB) across
      # restarts. Without it every container start re-streams it out of the package .npz.
      - land_mask_cache:/var/cache/kayak/land-mask

  beat:
    image: ghcr.io/ulises961/kayak-expedition-planner-backend:${KAYAK_IMAGE_TAG:-latest}
    container_name: kayak_beat
    restart: unless-stopped
    logging: *default-logging
    # Single process that only ever enqueues — the tasks themselves run in the worker.
    # Measured idle: 140 MiB. It was 1,031 MiB before tidal_service.py's import was made
    # lazy — a timer process was carrying the entire global land mask.
    deploy:
      resources:
        limits:
          memory: 320M
    command: celery -A celery_worker beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      CONFIG_MODE: ${CONFIG_MODE:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kayak}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kayak_prod}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      LIVE_REDIS_URL: ${LIVE_REDIS_URL:-redis://redis:6379/3}
      # Its own instance, not a DB on the shared one — see the redis-auth service for why.
      # DB 0 because a single-purpose instance has no other tenants to number around.
      #
      # Hardcoded rather than ${REVOCATION_REDIS_URL:-...}, breaking this file's usual
      # env-driven pattern on purpose. `:-` substitutes only when the var is *unset*, so any
      # REVOCATION_REDIS_URL left in .env silently wins — and this one is not a free
      # deployment choice: the target must be an instance that does not evict, or the
      # denylist gets dropped under memory pressure and signed-out devices come back to life
      # for the rest of their 15-minute token. The dev stack demonstrated exactly that
      # failure, and it presents as nothing at all: healthy containers, key in the wrong
      # place. Pointing this at an external/managed Redis later is a one-line change here,
      # which is reviewable in a way an .env override is not.
      REVOCATION_REDIS_URL: redis://redis-auth:6379/0
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-noreply@kayakplanner.app}
      # Rendered in the email footer when set, omitted when not (Api/config.py). Blank by
      # default on purpose — publishing a postal address is a trader-identity decision
      # (DSA), not a template default. Declared here so the operator *can* set it:
      # `environment:` is the only path into these containers.
      MAIL_POSTAL_ADDRESS: ${MAIL_POSTAL_ADDRESS:-}
      # Brevo's HTTP API, used instead of the SMTP config above when set — DigitalOcean
      # blocks outbound SMTP unconditionally on every droplet (confirmed 2026-09-06), so
      # this is the actual transport in production. See Services/mail_service.py.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      # Required, with no fallback: MinIO is no longer in this file, so there is nothing
      # local to default to. An unset STORAGE_ENDPOINT must refuse to start rather than
      # silently point at a service that does not exist.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?STORAGE_ENDPOINT is required}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:?STORAGE_PUBLIC_URL is required}
      # Required, not defaulted. This used to be ${MINIO_ROOT_USER:-kayak}; a bare `kayak`
      # default would let a box start with the wrong access key and fail to authenticate at
      # runtime instead of at boot — a silent misconfiguration is worse than a refusal.
      # Production does not get guessy defaults for credentials; docker-compose.yml keeps
      # the local-MinIO convenience.
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-kayak}
      # Two-bucket split (R2). Unset = both fall back to STORAGE_BUCKET, i.e. MinIO
      # behaviour unchanged. Compose writes an unset var as an empty string rather than
      # omitting it, which is why the app reads these with `or` and not a get() default.
      STORAGE_BUCKET_PUBLIC: ${STORAGE_BUCKET_PUBLIC:-}
      STORAGE_BUCKET_PRIVATE: ${STORAGE_BUCKET_PRIVATE:-}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # Doesn't exist in docker-compose.yml — dev runs the frontend via `pnpm dev` locally.
  # NEXT_PUBLIC_* values are already baked into this image at build time (frontend-ci.yml);
  # nothing here can change them at runtime.
  frontend:
    image: ghcr.io/ulises961/kayak-expedition-planner-frontend:${KAYAK_IMAGE_TAG:-latest}
    container_name: kayak_frontend
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Host 3300, not 3000 — 3000 is already taken by another app on this box. The
      # container's internal port stays 3000 (that's what the Next.js server inside it
      # actually listens on); only the host-side mapping changes, and nginx's proxy_pass
      # for the frontend vhost points at 3300 to match.
      - "127.0.0.1:3300:3000"
    environment:
      NODE_ENV: production
      # Proves to the backend that the X-Client-* headers on a login or refresh really came
      # from us, so the sessions list can name the paddler's browser and city instead of
      # this container's. Must hold the SAME value as the `backend` service's copy — a
      # mismatch is silent, and simply leaves every web session reading "Unknown device"
      # exactly as before. Not a NEXT_PUBLIC_ var: it is read server-side only, and baking
      # a shared secret into the client bundle would hand it to everyone.
      CLIENT_FORWARDING_SECRET: ${CLIENT_FORWARDING_SECRET:-}
      # The public origin every absolute URL the server emits is built from —
      # `frontend/lib/seo/origin.ts`, feeding sitemap.xml, robots.txt and the root layout's
      # `metadataBase`. `backend`, `sse`, `worker` and `beat` have all had this since they
      # started putting links in email; `frontend` never did, so it fell back to its default
      # and production served a sitemap advertising `http://localhost:3000/...` for every
      # page, plus OpenGraph image URLs resolving against the same. A crawler could reach
      # none of it. Required, not defaulted: the fallback is precisely what hid this.
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  tile_cache:
  land_mask_cache:
  rabbitmq_data:

networks:
  # Named + fixed so docker-compose.monitoring.yml (pgweb specifically, to resolve
  # `postgres` by service name) can join it as an external network without the two
  # compose files needing to be brought up together or share a lifecycle.
  default:
    name: kayak_net
