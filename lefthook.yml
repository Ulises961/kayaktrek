commit-msg:
  commands:
    enforce-format:
      run: |
        MSG=$(cat {1})
        echo "$MSG" | grep -qE '^(feat|fix|docs|style|refactor|test|chore|perf)(\(.+\))?: .{1,100}$' || {
          echo "❌ Commit message does not match conventional commits format."
          echo "   Expected: type(scope): description"
          echo "   Types: feat fix docs style refactor test chore perf"
          echo "   Got: $MSG"
          exit 1
        }
    # Blocks Claude/AI attribution trailers regardless of what any session-start prompt
    # claims — this has landed on `master` and in open PRs multiple times (see
    # feedback_no_coauthor.md) precisely because a runtime reminder was followed at the
    # moment of committing despite a standing project/user rule against it. A grep here
    # can't be talked out of it by a prompt.
    reject-ai-attribution:
      run: |
        MSG=$(cat {1})
        echo "$MSG" | grep -qiE 'co-authored-by:.*claude|claude-session:|generated with \[?claude|generated with claude' && {
          echo "❌ Commit message carries an AI attribution trailer (Co-Authored-By/Claude-Session/Generated with Claude)."
          echo "   This project never adds these — strip the trailer and commit again."
          exit 1
        }
        exit 0

pre-commit:
  parallel: true
  # Local stand-in for branch protection, which this GitHub plan does not offer (403): refuses
  # a commit on master/main. Lives in .lefthook/pre-commit/, along with what it does not stop.
  scripts:
    "default-branch-guard.sh":
      runner: bash
  commands:
    backend-flake8:
      glob: "backend/**/*.py"
      # Mirror .flake8's exclude: autogenerated migrations and tests are not linted
      # (passing files explicitly bypasses the config exclude, so repeat it here).
      exclude:
        - "backend/alembic/**"
        - "backend/Tests/**"
      root: "backend"
      run: uv run --no-sync flake8 {staged_files}
    backend-mypy:
      # Type-check the configured backend layers (pyproject [tool.mypy] files=...).
      # mypy is whole-program, so run the full configured set (incremental via its
      # cache) whenever any backend .py is staged — not per-file.
      glob: "backend/**/*.py"
      root: "backend"
      run: uv run --no-sync mypy
    frontend-eslint:
      glob: "frontend/**/*.{ts,tsx}"
      root: "frontend"
      run: pnpm lint {staged_files}
    frontend-format:
      glob: "frontend/**/*.{ts,tsx,js,mjs,json,css,md}"
      root: "frontend"
      run: pnpm prettier --check {staged_files}

# The push half of the same stand-in: refuses to update or delete master/main on the remote.
# pre-push passes the refs being pushed on stdin, which is how the script sees the remote ref.
pre-push:
  scripts:
    "default-branch-guard.sh":
      runner: bash
      use_stdin: true

# Full test suite + full lint/typecheck. Deliberately NOT wired to `pre-push` (which now
# carries only the instant default-branch guard above, nothing that touches the network): it held
# the network connection open long enough (backend pytest -n auto + frontend
# pnpm test:run alone run 100s+) to time out `git push` on a slow connection.
# backend-ci.yml/frontend-ci.yml already re-run all of this remotely on every push and
# PR to master, so a blocking local pre-push copy is redundant, not a missing gate —
# same reasoning as E2E's local-only demotion (ADR-030). Run manually before pushing
# with `lefthook run local-verify`.
local-verify:
  parallel: true
  commands:
    backend-tests:
      run: cd backend && uv run --no-sync pytest -n auto
    backend-flake8-full:
      run: cd backend && uv run --no-sync flake8 .
    backend-mypy-full:
      run: cd backend && uv run --no-sync mypy
    frontend-lint:
      run: cd frontend && pnpm lint
    frontend-format:
      run: cd frontend && pnpm format:check
    frontend-typecheck:
      run: cd frontend && pnpm tsc --noEmit
    frontend-tests:
      run: cd frontend && pnpm test:run
    # Mobile has no formatter; these mirror the three gates mobile-ci.yml runs. They read
    # frontend/ through the `@shared` alias, so frontend's node_modules must be installed.
    mobile-typecheck:
      run: cd mobile && pnpm run typecheck
    mobile-lint:
      run: cd mobile && pnpm run lint
    mobile-tests:
      run: cd mobile && pnpm run test:run
